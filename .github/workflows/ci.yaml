name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx biome check --reporter=github .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run test:markdown -w @bdc/site

  build:
    name: Build
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        app: [site]
        include:
          - os: ubuntu-latest
            app: docs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build ${{ matrix.app }}
        run: npm run build -w @bdc/${{ matrix.app }}

      - name: Upload build output
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: apps/${{ matrix.app }}/dist

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/site

      - name: Accessibility audit
        working-directory: apps/site
        run: node a11y/full.js

  publish-markdown:
    name: Publish Markdown
    runs-on: ubuntu-latest
    needs: [build, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    concurrency:
      group: publish-bdc-markdown
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check publishing credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.MARKDOWN_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Set MARKDOWN_REPO_TOKEN to enable Markdown publication.'
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          path: source

      - name: Skip superseded builds
        if: steps.credentials.outputs.configured == 'true'
        id: current
        working-directory: source
        run: |
          latest=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: site-dist
          path: build-output/site

      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: docs-dist
          path: build-output/docs

      - name: Check out Markdown repository
        if: steps.current.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MARKDOWN_REPO_NAME }}
          token: ${{ secrets.MARKDOWN_REPO_TOKEN }}
          path: markdown-repository

      - name: Sync and publish Markdown
        if: steps.current.outputs.publish == 'true'
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s build-output/site/markdown/index.md
          test -s build-output/docs/markdown/index.md
          mkdir -p markdown-repository/site markdown-repository/docs
          rsync -a --delete build-output/site/markdown/ markdown-repository/site/
          rsync -a --delete build-output/docs/markdown/ markdown-repository/docs/
          cd markdown-repository
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site docs
          if git diff --cached --quiet; then
            echo 'Markdown is unchanged.'
            exit 0
          fi
          git commit -m "Update site and docs Markdown from ${SOURCE_REPOSITORY}@${GITHUB_SHA}"
          git push

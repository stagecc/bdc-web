version: 1
applications:
  - appRoot: apps/docs
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=@bdc/docs
      artifacts:
        baseDirectory: apps/docs/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  - appRoot: apps/site
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=@bdc/site
      artifacts:
        baseDirectory: apps/site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  - appRoot: apps/consortium
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=@bdc/consortium
      artifacts:
        baseDirectory: apps/consortium/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

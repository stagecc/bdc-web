version: 1
applications:
  - appRoot: apps/docs
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=@bdc/docs
      artifacts:
        baseDirectory: apps/docs/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  - appRoot: apps/site
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=@bdc/site
      artifacts:
        baseDirectory: apps/site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  - appRoot: apps/consortium
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - node apps/consortium/scripts/check-auth-env.mjs
            - npm run build --workspace=@bdc/consortium
            - node apps/consortium/scripts/package-server.mjs
      artifacts:
        baseDirectory: apps/consortium/.amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

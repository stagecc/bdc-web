version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run build --workspace=@bdc/site

artifacts:
  base-directory: apps/site/dist
  files:
    - '**/*'

cache:
  paths:
    - node_modules/**/*
    - /root/.npm/**/*
